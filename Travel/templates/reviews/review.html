{% extends "Travel/base.html" %}

{% block title %}
YatraNest | Reviews
{% endblock %}

{% block content %}

<section class="section">

    <div class="section-heading">

        <div>

            <span class="section-label">
                TRAVEL REVIEWS
            </span>

            <h2>
                Share Your <span>Experience</span>
            </h2>

        </div>

        <p>
            Tell us about your journey with YatraNest.
        </p>

    </div>


    <div style="
        max-width:700px;
        margin:auto;
        background:white;
        padding:35px;
        border-radius:20px;
        box-shadow:0 15px 40px rgba(0,0,0,.08);
    ">

        <h3 style="
            font-family:'Playfair Display',serif;
            font-size:28px;
            margin-bottom:25px;
        ">
            Write a Review
        </h3>


        <div style="margin-bottom:20px;">

            <label>
                Rating
            </label>

            <select
                style="
                    width:100%;
                    padding:14px;
                    margin-top:8px;
                    border:1px solid #ddd;
                    border-radius:10px;
                "
            >

                <option>★★★★★ - 5</option>
                <option>★★★★☆ - 4</option>
                <option>★★★☆☆ - 3</option>
                <option>★★☆☆☆ - 2</option>
                <option>★☆☆☆☆ - 1</option>

            </select>

        </div>


        <div style="margin-bottom:20px;">

            <label>
                Your Review
            </label>

            <textarea
                rows="6"
                placeholder="Write your travel experience..."
                style="
                    width:100%;
                    padding:14px;
                    margin-top:8px;
                    border:1px solid #ddd;
                    border-radius:10px;
                    resize:vertical;
                "
            ></textarea>

        </div>


        <button
            type="button"
            class="search-btn"
            onclick="alert('Review section connected successfully!')"
        >

            <i class="fa-solid fa-star"></i>

            Submit Review

        </button>

    </div>

</section>

{% endblock %}
